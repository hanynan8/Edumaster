# # .github/workflows/ci.yml
# #
# # 🆕 CI أساسي — الحاجة اللي كانت ناقصة أصلًا عشان المشروع يبقى "احترافي":
# # قبل كده أي باج (زي باج dependency array اللي سبب "جاري التحقق من
# # الصلاحية..." المعلّقة) كان ممكن يوصل للمستخدمين مباشرة لأن مفيش حد بيفحص
# # الكود تلقائيًا قبل الدمج. دلوقتي كل push/Pull Request بيتفحص تلقائيًا:
# #   1) lint  — أخطاء أسلوب وقواعد React (زي react-hooks/exhaustive-deps).
# #   2) test  — اختبارات jest (access.test.js وأي اختبار جديد).
# #   3) build — يتأكد إن المشروع فعليًا بيتبني من غير أخطاء (أقوى فحص، لأن
# #      أخطاء كتير (زي type errors أو imports غلط) بتظهر بس وقت البناء).
# #
# # لو أي خطوة فشلت، الـ PR بيتعلّم بعلامة X حمرا على GitHub، فمفيش حد يقدر
# # يدمج كود كاسر من غير ما يشوفها.

